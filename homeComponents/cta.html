
<!-- CTA Section -->
<section class="cta-band-section">
    <div class="cta-band-inner">

        <!-- Background decorative orbs -->
        <div class="cta-band-orb cta-band-orb-1"></div>
        <div class="cta-band-orb cta-band-orb-2"></div>

        <!-- Left: Text Content -->
        <div class="cta-band-left">
            <h2 class="cta-band-heading">
                Get started with <br>BookyAI today
            </h2>
            <p class="cta-band-sub">
                Try BookyAI free for 14 days—you'll have access to every feature.
                Cancel any time.
            </p>

            <!-- Trust pills -->
            <div class="cta-band-pills">
                <span class="cta-pill"><i class="fas fa-check-circle"></i> 14-Day Free Trial</span>
             
                <span class="cta-pill"><i class="fas fa-times-circle"></i> Cancel Anytime</span>
            </div>

            <div class="cta-band-actions">
                <a href="/accounts/signup/" class="cta-band-btn-primary">
                    Start your free trial &nbsp;<i class="fas fa-arrow-right"></i>
                </a>
                <a href="/contact" class="cta-band-btn-ghost">Talk to Sales</a>
            </div>
        </div>

        <!-- Right: Dashboard Mockup -->
        <div class="cta-band-right">
            <div class="cta-band-mockup-wrap">
                <!-- Browser chrome bar -->
                <div class="cta-band-browser-bar">
                    <span class="cta-bd"></span>
                    <span class="cta-bd"></span>
                    <span class="cta-bd"></span>
                    <span class="cta-url-bar">bookyai.co.uk / dashboard</span>
                </div>
                <img src="{% static 'images/dashboard.webp' %}"
                     class="cta-band-mockup-img"
                     alt="BookyAI Dashboard">
            </div>
        </div>

    </div>
</section>
